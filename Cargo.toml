[package]
name = "SigmaOS-antivirus2"
version = "0.1.0"
edition = "2021"
description = "Antivirus antivirus compatibility layer for SigmaOS"
license = "MIT"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-antivirus2"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

[lib]
name = "antivirus2"
path = "src/lib.rs"

[[bin]]
name = "sigmaos-antivirus2"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
